name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI checks
        run: bun run ci

      - name: Read package version
        id: package
        run: |
          VERSION="$(bun -e 'const pkg = JSON.parse(await Bun.file("package.json").text()); console.log(pkg.version);')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        run: |
          test "${GITHUB_REF_NAME}" = "v${{ steps.package.outputs.version }}"

    outputs:
      version: ${{ steps.package.outputs.version }}

  build-mac:
    name: Build macOS (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Python virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "audio-separator==0.44.1" onnxruntime

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Build renderer and electron
        run: |
          bun run build:renderer
          bun run build:electron

      - name: Build worker binary (PyInstaller)
        run: bun run build:worker

      - name: Build macOS .dmg
        run: bun x electron-builder --mac --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stemmer-mac-${{ matrix.arch }}
          path: |
            release-output/*.dmg
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [validate, build-mac]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
